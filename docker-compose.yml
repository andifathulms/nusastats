services:
  db:
    image: postgres:16-alpine
    # Stock Postgres defaults (128MB shared_buffers, 4MB work_mem) are sized
    # for a toy box; the hot tables here are ~2.5GB (DataPoint 1.4GB,
    # Dukcapil regions and the check log ~0.5GB each), so grouped analytics
    # spilled to disk and evicted each other's pages. Overridable per host.
    command: >
      postgres
      -c shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-3GB}
      -c work_mem=${PG_WORK_MEM:-16MB}
      -c maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-256MB}
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
    # Parallel query workers share memory through /dev/shm (64MB by default).
    shm_size: 256mb
    env_file: backend/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cakupan}
      POSTGRES_USER: ${POSTGRES_USER:-cakupan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cakupan}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cakupan}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file: backend/.env
    environment:
      # Allow the browser-side frontend (served from the mapped host port,
      # e.g. localhost:3010) to call this API directly under CORS.
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3010"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: ./backend
    command: celery -A cakupan worker -l info
    volumes:
      - ./backend:/app
    env_file: backend/.env
    depends_on:
      - web

  celery_beat:
    build: ./backend
    command: celery -A cakupan beat -l info
    volumes:
      - ./backend:/app
    env_file: backend/.env
    depends_on:
      - web

  frontend:
    build: ./frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
      # Keep the image's node_modules — don't let the bind mount hide it.
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - web

  # Renders /card/* pages to PNG/ZIP for the /carousel page's downloads, with the
  # same Playwright version as `npm run card` (frontend/scripts/card/serve.mjs).
  cards:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && node serve.mjs"
    environment:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      CARD_BASE: http://frontend:3000
      API_PUBLIC: http://localhost:8010
      API_INTERNAL: http://web:8000
    volumes:
      - ./frontend/scripts/card:/app
      # The host's node_modules (macOS) must not shadow the container's.
      - /app/node_modules
    ports:
      - "3012:3012"
    depends_on:
      - frontend
      - web

volumes:
  postgres_data:
