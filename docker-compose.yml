services:
  db:
    image: postgres:16-alpine
    env_file: backend/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cakupan}
      POSTGRES_USER: ${POSTGRES_USER:-cakupan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cakupan}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cakupan}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file: backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: ./backend
    command: celery -A cakupan worker -l info
    volumes:
      - ./backend:/app
    env_file: backend/.env
    depends_on:
      - web

  celery_beat:
    build: ./backend
    command: celery -A cakupan beat -l info
    volumes:
      - ./backend:/app
    env_file: backend/.env
    depends_on:
      - web

volumes:
  postgres_data:
