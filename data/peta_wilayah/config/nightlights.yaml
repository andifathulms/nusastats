# Night lights (World Bank Light Every Night, VIIRS DNB monthly composites).
years: [2018, 2019, 2020, 2021, 2022, 2023, 2024]   # 'ops' processing only (consistent background)
base_year: 2018                                      # growth is reported relative to this year
annual:
  statistic: median          # per-pixel median of cloud-free months: drops short-lived fire/flaring spikes
  min_months: 6              # fewer usable months in a year -> that year is not computed
  window_pad_deg: 0.02       # province window padding
stats:
  lit_threshold_nw: 1.0      # nW/cm2/sr: a pixel is "lit" at or above this annual median
  coverage_supersample: 8    # sub-pixel polygon coverage (handles small kecamatan vs ~460 m pixels)
  max_nodata_pct: 1.0        # fail if more of the polygon has no annual value
  max_area_diff_pct: 3.0     # covered-pixel area vs geodesic polygon area (sub-pixel coverage of tiny islets)
render:
  max_radiance_nw: 60        # top of the log colour scale
  colors: ["#0b1026", "#3b2a6b", "#a23f78", "#f08a4b", "#fff3c4"]   # dark -> warm -> bright
  webp_quality: 90
